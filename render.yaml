# Render Web Service blueprint (not Static Site)
services:
  - type: web
    name: gridfleet-orchestration
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: http://localhost:5173,https://lbrce-fsd-hackthon-one.vercel.app,https://lbrce-fsd-hackthon-1jkv.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_URL
        value: /api
      - key: VITE_SOCKET_URL
        value: https://lbrce-fsd-hackthon-1jkv.onrender.com