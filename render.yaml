# Render Blueprint — use a Web Service (NOT a Static Site).
# Dashboard: New → Blueprint → connect this repo
# Or create Web Service manually with the settings below.

services:
  - type: web
    name: routeguardian
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: ALLOW_DEMO_AUTH
        value: "true"
      - key: ADMIN_EMAILS
        value: admin@example.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_URL
        value: /api
